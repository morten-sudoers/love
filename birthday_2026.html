<!doctype html>
<html lang="es">
<head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Para el amor de mi vida, Fabi ❤️</title>
    <style>
        /* CSS Crítico para carga instantánea */
        :root { --p: #ff4d6d; --txt: #fff; }
        * { box-sizing: border-box; margin: 0; padding: 0; }
        body { 
            background: #000; 
            color: var(--txt); 
            font-family: serif; 
            height: 100vh; 
            overflow: hidden; 
            display: grid; 
            place-items: center; 
        }
        .bg {
            position: fixed; inset: 0; z-index: -2;
            background: linear-gradient(rgba(0,0,0,0.6),#000), url('backbirthday.jpeg') center/cover no-repeat;
        }
        canvas { position: fixed; inset: 0; z-index: -1; pointer-events: none; }
        .card {
            width: min(600px, 90vw);
            padding: 35px;
            border-radius: 25px;
            background: rgba(255,255,255,0.08);
            backdrop-filter: blur(10px);
            -webkit-backdrop-filter: blur(10px);
            border: 1px solid rgba(255,255,255,0.1);
            text-align: center;
        }
        h1 { font-style: italic; font-size: 2.5rem; margin-bottom: 15px; color: var(--p); text-shadow: 0 2px 10px rgba(0,0,0,0.5); }
        .type { font-size: 1.2rem; line-height: 1.6; font-style: italic; min-height: 120px; }
        .cursor { display: inline-block; width: 2px; height: 1em; background: var(--p); animation: b 0.8s infinite; vertical-align: middle; }
        @keyframes b { 50% { opacity: 0; } }
        .f { margin-top: 25px; font-size: 0.8rem; opacity: 0.5; font-family: sans-serif; }
    </style>
</head>
<body>
    <div class="bg"></div>
    <canvas id="fw"></canvas>
    <div class="card">
        <h1>¡Feliz Cumpleaños Mi Amor!</h1>
        <div class="type"><span id="t"></span><span class="cursor"></span></div>
        <div class="f">Con todo mi amor, tu fan enamorado</div>
    </div>

<script>
// Motor de Fuegos Artificiales Nativo (0KB de carga externa)
const canvas = document.getElementById('fw');
const ctx = canvas.getContext('2d');
let particles = [];

function resize() {
    canvas.width = window.innerWidth;
    canvas.height = window.innerHeight;
}
window.addEventListener('resize', resize);
resize();

class Particle {
    constructor(x, y, color) {
        this.x = x; this.y = y; this.color = color;
        this.v = { x: (Math.random()-0.5)*8, y: (Math.random()-0.5)*8 };
        this.a = 1;
    }
    draw() {
        ctx.globalAlpha = this.a;
        ctx.fillStyle = this.color;
        ctx.beginPath(); ctx.arc(this.x, this.y, 2, 0, Math.PI*2); ctx.fill();
    }
    update() {
        this.x += this.v.x; this.y += this.v.y; this.a -= 0.01;
    }
}

function spawn() {
    const x = Math.random()*canvas.width;
    const y = Math.random()*canvas.height*0.5;
    const colors = ['#ff4d6d', '#ffb7ff', '#ffffff', '#ff0040'];
    const color = colors[Math.floor(Math.random()*colors.length)];
    for(let i=0; i<40; i++) particles.push(new Particle(x, y, color));
}

function animate() {
    ctx.clearRect(0, 0, canvas.width, canvas.height);
    particles = particles.filter(p => p.a > 0);
    particles.forEach(p => { p.update(); p.draw(); });
    if(Math.random() < 0.05) spawn();
    requestAnimationFrame(animate);
}

// Escritura rápida
const msg = "Brindo por my Little Queenie, la dueña de mis suspiros. Poseedora de la sabiduría de las antiguas crónicas y la belleza que inspira los versos de los trovadores. Que este año de vida sea un sendero de flores bajo tus pies, pues no existe en este mundo ni en el siguiente mujer más digna de ser amada. Feliz cumpleaños, amor mío.";
let i = 0;
function type() {
    if(i < msg.length) {
        document.getElementById('t').textContent += msg.charAt(i);
        i++;
        setTimeout(type, 30);
    }
}

// Inicio inmediato
document.addEventListener('DOMContentLoaded', () => {
    animate();
    type();
});
</script>
</body>
</html>
